# onprem-agent-lab
# Usage: docker compose --profile platform up -d
# All secrets come from .env (see .env.example).

name: onprem-agent-lab

networks:
  backend:
    name: oal-backend

volumes:
  postgres-data:
  redis-data:

services:
  # ---------------------------------------------------------------
  # PostgreSQL — LiteLLM metadata (virtual keys, spend, request logs)
  # Not published to host; reachable only on the backend network.
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    profiles: [platform]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------
  # Redis — LiteLLM rate-limit counters (rpm/tpm/parallel) and cache
  # Password is read from env at runtime, not baked into the compose
  # command string. AOF persistence enabled.
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    profiles: [platform]
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
