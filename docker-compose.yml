# onprem-agent-lab
# Usage: docker compose --profile platform up -d
# All secrets come from .env (see .env.example).

name: onprem-agent-lab

networks:
  backend:
    name: oal-backend

volumes:
  postgres-data:
  redis-data:
  ollama-models:
  qdrant-data:

services:
  # ---------------------------------------------------------------
  # PostgreSQL — LiteLLM metadata (virtual keys, spend, request logs)
  # Not published to host; reachable only on the backend network.
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    profiles: [platform]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------
  # Redis — LiteLLM rate-limit counters (rpm/tpm/parallel) and cache
  # Password is read from env at runtime, not baked into the compose
  # command string. AOF persistence enabled.
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    profiles: [platform]
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------
  # Ollama — local inference, OpenAI-compatible API on :11434
  # Internal only: apps must go through LiteLLM, never call this directly.
  # GPU: add -f docker-compose.gpu.yml (see that file).
  # ---------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.40.18
    profiles: [platform]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # Concurrent requests per loaded model (affects VRAM: KV cache x N)
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-4}
      # Chat + embedding model resident at the same time
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
    volumes:
      - ollama-models:/root/.ollama
    networks: [backend]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # One-shot job: pull the chat + embedding models into the ollama volume.
  ollama-init:
    image: ollama/ollama:0.40.18
    profiles: [platform]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODELS: >-
        ${OLLAMA_CHAT_MODEL:?set OLLAMA_CHAT_MODEL in .env}
        ${OLLAMA_EMBED_MODEL:?set OLLAMA_EMBED_MODEL in .env}
    volumes:
      - ./infra/ollama/pull-models.sh:/pull-models.sh:ro
    entrypoint: ["/bin/sh", "/pull-models.sh"]
    networks: [backend]

  # ---------------------------------------------------------------
  # LiteLLM Proxy — the only LLM entry point for apps.
  # Virtual keys / spend in Postgres, rate-limit counters in Redis.
  # Published on 127.0.0.1 only (dev access from host).
  # ---------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm-database:main-v1.83.14-stable
    profiles: [platform]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Ollama ignores the key, but the OpenAI client requires one
      OLLAMA_API_KEY: ollama-no-auth
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ---------------------------------------------------------------
  # Qdrant — vector store (REST :6333, gRPC :6334)
  # API key required for all data/collection endpoints; health probes
  # (/healthz, /readyz, /livez) stay open. Internal only by default;
  # publish to 127.0.0.1 for debugging with -f docker-compose.debug.yml.
  # Image has no curl/wget, so the healthcheck uses bash /dev/tcp.
  # ---------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.20.2
    profiles: [platform]
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__LOG_LEVEL: INFO
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [backend]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
